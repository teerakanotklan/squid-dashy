version: '3.8'

services:
  # Squid Web Dashboard
  squid-dashboard:
    build: .
    container_name: squid-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_PORT=8080
      - SQUID_HOST=squid-proxy          # หรือ IP ของเครื่อง Squid เช่น 127.0.0.1 หรือ host.docker.internal
      - SQUID_PORT=3128
      - SQUID_ACCESS_LOG=/var/log/squid/access.log
    volumes:
      # Mount access.log จากเครื่อง Host เข้ามาเพื่ออ่าน Log แบบ Real-time
      - /var/log/squid:/var/log/squid:ro
    depends_on:
      - squid-proxy

  # (ทางเลือก) Squid Proxy Service ตัวอย่างสำหรับทดสอบระบบ
  squid-proxy:
    image: ubuntu/squid:latest
    container_name: squid-proxy
    restart: unless-stopped
    ports:
      - "3128:3128"
    volumes:
      - ./squid.conf.sample:/etc/squid/squid.conf:ro
      - /var/log/squid:/var/log/squid
